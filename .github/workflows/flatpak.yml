name: Flatpak CI & Release

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]

jobs:
  flatpak:
    name: "Build Flatpak"
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:freedesktop-25.08
      options: --privileged
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Vendor Rust dependencies for offline build
        run: |
          cargo vendor packaging/flatpak/vendor

      - name: Build and validate Flatpak
        uses: flatpak/flatpak-github-actions/flatpak-builder@v6
        with:
          bundle: SystemMonitor.flatpak
          manifest-path: packaging/flatpak/io.github.SeniduRavihara.SystemMonitor.yml
          cache-key: flatpak-builder-${{ github.sha }}

      - name: Upload Flatpak bundle artifact
        uses: actions/upload-artifact@v4
        with:
          name: SystemMonitor-flatpak
          path: SystemMonitor.flatpak

      - name: Release bundle on GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: SystemMonitor.flatpak
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
