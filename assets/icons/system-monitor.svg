<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2c313a"/>
      <stop offset="100%" stop-color="#181a1f"/>
    </linearGradient>
    <linearGradient id="gridGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3584e4" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#3584e4" stop-opacity="0.05"/>
    </linearGradient>
    <linearGradient id="lineGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3584e4"/>
      <stop offset="50%" stop-color="#33d17a"/>
      <stop offset="100%" stop-color="#f66151"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- GNOME standard rounded tile -->
  <rect x="8" y="8" width="112" height="112" rx="26" fill="url(#bgGrad)" stroke="#3e4451" stroke-width="2"/>

  <!-- Screen grid lines -->
  <line x1="20" y1="40" x2="108" y2="40" stroke="#323842" stroke-width="1" stroke-dasharray="2,2"/>
  <line x1="20" y1="64" x2="108" y2="64" stroke="#323842" stroke-width="1" stroke-dasharray="2,2"/>
  <line x1="20" y1="88" x2="108" y2="88" stroke="#323842" stroke-width="1" stroke-dasharray="2,2"/>
  <line x1="42" y1="24" x2="42" y2="104" stroke="#323842" stroke-width="1" stroke-dasharray="2,2"/>
  <line x1="64" y1="24" x2="64" y2="104" stroke="#323842" stroke-width="1" stroke-dasharray="2,2"/>
  <line x1="86" y1="24" x2="86" y2="104" stroke="#323842" stroke-width="1" stroke-dasharray="2,2"/>

  <!-- Pulse Area Fill -->
  <path d="M 20 88 L 36 88 L 48 54 L 58 76 L 68 34 L 78 88 L 92 60 L 100 88 L 108 88 L 108 100 L 20 100 Z" fill="url(#gridGrad)"/>

  <!-- Dynamic Pulse Graph Line -->
  <path d="M 20 88 L 36 88 L 48 54 L 58 76 L 68 34 L 78 88 L 92 60 L 100 88 L 108 88"
        fill="none" stroke="url(#lineGrad)" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)"/>

  <!-- Gauge Circular Accent in upper corner -->
  <circle cx="96" cy="32" r="10" fill="none" stroke="#323842" stroke-width="3"/>
  <path d="M 96 22 A 10 10 0 0 1 106 32" fill="none" stroke="#3584e4" stroke-width="3" stroke-linecap="round"/>

  <!-- Peak point indicator -->
  <circle cx="68" cy="34" r="3.5" fill="#ffffff" stroke="#33d17a" stroke-width="2"/>
</svg>
