[package]
name = "system-monitor"
version = "0.1.0"
edition = "2024"

[dependencies]
slint = { version = "=1.18.1", default-features = false, features = ["std", "backend-winit", "renderer-software", "compat-1-2"] }
libc = "0.2"

[build-dependencies]
slint-build = "=1.18.1"

[dev-dependencies]
i-slint-backend-testing = { version = "=1.18.1", features = ["renderer-software"] }
image = { version = "0.25", default-features = false, features = ["png"] }

[profile.dev]
debug = 0
[profile.test]
debug = 0
